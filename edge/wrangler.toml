name = "codex-oauth-proxy"
main = "src/index.ts"
compatibility_date = "2025-08-01"

[build]
command = "go run github.com/syumai/workers/cmd/workers-assets-gen -mode=go && GOOS=js GOARCH=wasm go build -ldflags='-s -w' -o build/app.wasm ./cmd/codex-oauth-proxy-worker"
cwd = ".."

[[durable_objects.bindings]]
name = "ACCOUNT_POOL"
class_name = "AccountPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountPool"]

[[vpc_networks]]
binding = "NATIVE_EGRESS"
# Replace this with the UUID of the Cloudflare Tunnel selected for egress.
tunnel_id = "63f25b3f-89c9-428b-9516-afd65c748b37"
remote = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true
persist = true
